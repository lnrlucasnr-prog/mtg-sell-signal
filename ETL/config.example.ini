# Copy this file to config.ini (same folder) and fill in your values.
# config.ini is listed in .gitignore so your settings never reach GitHub.

[sqlserver]
server = YOUR_SERVER_NAME
database = mtg
# Leave blank to auto-detect an installed SQL Server ODBC driver.
driver =
# yes = Windows Authentication. Set to no and fill in username/password for SQL logins.
trusted_connection = yes
username =
password =

[imports]
# Folder (e.g. synced by Google Drive for desktop) holding the ManaBox exports:
# one collection .csv and deck lists named "Deck: <name>.txt" / "Edit: <name>.txt".
folder = G:\My Drive\MTG Exports
